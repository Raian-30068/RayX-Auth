<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Создать учётную запись</title>
    
    <script src="https://telegram.org"></script>
    
    <link rel="stylesheet" href="https://fontawesome.com">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="icon.png" type="image/png">
</head>

<body>
    <div class="wrapper">
        <h1>Создать учётную запись RayX</h1>
    
        <form>
            <div class="input-box">
                <input type="text" name="username" placeholder="Придумайте имя пользователя" required>
                <i class="fa-solid fa-user"></i>
            </div>

            <div class="input-box">
                <input type="email" name="email" placeholder="Введите e-mail" required>
                <i class="fa-solid fa-envelope"></i>
            </div>

            <div class="input-box">
                <input type="tel" id="phone" name="phone" placeholder="Введите номер телефона" pattern="^\+?[0-9\s\-\(\)]+$" required>
                <i class="fa-solid fa-phone"></i>
            </div>

            <div class="input-box">
                <input type="password" name="password" placeholder="Придумайте пароль" required>
                <i class="fa-solid fa-lock"></i>
            </div>

            <div class="input-box">
                <input type="password" name="confirm_password" placeholder="Введите пароль повторно" required>
                <i class="fa-solid fa-key"></i>
            </div>

            <button type="submit" class="btn">Создать аккаунт</button>
                            
            <div class="login-link">
                <p>Уже есть аккаунт? <a href="https://raian-30068.github.io/RayX-Auth-2/">Вход</a></p>
            </div>
        </form>

    </div>

<script src="cas_v2.js?v=3"></script>

</body>
</html>
